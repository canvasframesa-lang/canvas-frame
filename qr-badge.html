<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas Frame — Brand Badge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  .badge {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 32px 40px;
    display: flex;
    align-items: center;
    gap: 28px;
    max-width: 520px;
  }

  .badge-logo {
    flex-shrink: 0;
  }

  .badge-logo svg {
    height: 90px;
    width: auto;
  }

  .badge-divider {
    width: 1px;
    height: 80px;
    background: linear-gradient(to bottom, transparent, #f7b32c, transparent);
  }

  .badge-qr {
    flex-shrink: 0;
  }

  .badge-qr canvas {
    display: block;
    border-radius: 4px;
  }

  .badge-text {
    flex: 1;
    text-align: center;
  }

  .badge-brand {
    font-size: 14px;
    font-weight: 700;
    color: #032b44;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .badge-tagline {
    font-size: 10px;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  .badge-scan {
    font-size: 9px;
    color: #032b44;
    margin-top: 8px;
    opacity: 0.6;
  }

  @media print {
    body { background: none; }
    .badge {
      box-shadow: none;
      border: 1px solid #e0e0e0;
      border-radius: 0;
    }
  }
</style>

  var qr = qrcode(0, 'M');
  qr.addData(url);
  qr.make();

  var canvas = document.getElementById('qr');
  var ctx = canvas.getContext('2d');
  var modules = qr.getModuleCount();
  var cellSize = size / modules;

  canvas.width = size;
  canvas.height = size;

  ctx.fillStyle = '#032b44';
  for (var r = 0; r < modules; r++) {
    for (var c = 0; c < modules; c++) {
      if (qr.isDark(r, c)) {
        ctx.fillRect(
          Math.round(c * cellSize),
          Math.round(r * cellSize),
          Math.ceil(cellSize),
          Math.ceil(cellSize)
        );
      }
    }
  }
})();
</script>

</body>
</html>
